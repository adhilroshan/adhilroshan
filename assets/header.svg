<svg width="920" height="180" viewBox="0 0 920 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#080b0f" />
    </linearGradient>
    <linearGradient id="hairline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30363d" />
      <stop offset="30%" stop-color="#58a6ff" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#30363d" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#21262d" />
    </linearGradient>
  </defs>

  <!-- Frame Background -->
  <rect x="1" y="1" width="918" height="178" rx="10" fill="url(#bg_grad)" stroke="#30363d" stroke-width="1"/>
  <line x1="1" y1="1" x2="919" y2="1" stroke="url(#hairline)" stroke-width="1.5" />

  <!-- LEFT COLUMN: Identity & Bio -->
  <g transform="translate(36, 28)">
    <!-- Monospace Eyebrow -->
    <text x="0" y="12" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="500" fill="#7d8590" letter-spacing="1.2">// FULL-STACK AI ENGINEER • SENIOR AI ENG</text>
    
    <!-- Name -->
    <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="36" font-weight="700" fill="#f0f6fc" letter-spacing="-0.5">Adhil Roshan</text>

    <!-- Tagline -->
    <text x="0" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13.5" font-weight="400" fill="#8b949e">Architecting autonomous agent workflows, local-first intelligence, and multi-platform systems.</text>

    <!-- Focus Tags -->
    <g transform="translate(0, 108)">
      <rect x="0" y="0" width="86" height="20" rx="3" fill="#161b22" stroke="#21262d"/>
      <text x="43" y="14" font-family="ui-monospace, monospace" font-size="10" fill="#7d8590" text-anchor="middle">TypeScript</text>

      <rect x="94" y="0" width="64" height="20" rx="3" fill="#161b22" stroke="#21262d"/>
      <text x="126" y="14" font-family="ui-monospace, monospace" font-size="10" fill="#7d8590" text-anchor="middle">Python</text>

      <rect x="166" y="0" width="70" height="20" rx="3" fill="#161b22" stroke="#21262d"/>
      <text x="201" y="14" font-family="ui-monospace, monospace" font-size="10" fill="#7d8590" text-anchor="middle">PyTorch</text>

      <rect x="244" y="0" width="64" height="20" rx="3" fill="#161b22" stroke="#21262d"/>
      <text x="276" y="14" font-family="ui-monospace, monospace" font-size="10" fill="#7d8590" text-anchor="middle">Flutter</text>

      <rect x="316" y="0" width="58" height="20" rx="3" fill="#161b22" stroke="#21262d"/>
      <text x="345" y="14" font-family="ui-monospace, monospace" font-size="10" fill="#7d8590" text-anchor="middle">Tauri</text>

      <rect x="382" y="0" width="84" height="20" rx="3" fill="#161b22" stroke="#21262d"/>
      <text x="424" y="14" font-family="ui-monospace, monospace" font-size="10" fill="#7d8590" text-anchor="middle">Agentic AI</text>
    </g>
  </g>

  <!-- RIGHT COLUMN: Engineering Telemetry Box -->
  <g transform="translate(605, 26)">
    <rect width="280" height="126" rx="6" fill="#090d13" stroke="#21262d" stroke-width="1"/>
    
    <!-- Window Bar -->
    <path d="M0 6C0 2.68629 2.68629 0 6 0H274C277.314 0 280 2.68629 280 6V24H0V6Z" fill="#161b22"/>
    <line x1="0" y1="24" x2="280" y2="24" stroke="#21262d" stroke-width="1"/>
    
    <!-- Indicator Dots -->
    <circle cx="14" cy="12" r="3.5" fill="#30363d" />
    <circle cx="24" cy="12" r="3.5" fill="#30363d" />
    <circle cx="34" cy="12" r="3.5" fill="#30363d" />

    <!-- Title in Window Bar -->
    <text x="50" y="15" font-family="ui-monospace, monospace" font-size="9.5" fill="#7d8590" letter-spacing="0.5">SYSTEM_PROFILE // v2026.09</text>
    
    <!-- Status Green Pulse -->
    <circle cx="256" cy="12" r="3" fill="#238636" />
    <text x="246" y="15" font-family="ui-monospace, monospace" font-size="9" fill="#3fb950" text-anchor="end">ACTIVE</text>

    <!-- Console Specs -->
    <text x="16" y="46" font-family="ui-monospace, monospace" font-size="10.5" fill="#7d8590">ROLE    <tspan fill="#c9d1d9">: Senior AI Engineer</tspan></text>
    <text x="16" y="66" font-family="ui-monospace, monospace" font-size="10.5" fill="#7d8590">FOCUS   <tspan fill="#c9d1d9">: Autonomous Agents &amp; Workflows</tspan></text>
    <text x="16" y="86" font-family="ui-monospace, monospace" font-size="10.5" fill="#7d8590">LOCAL   <tspan fill="#c9d1d9">: On-Device LLM &amp; RAG Systems</tspan></text>
    <text x="16" y="106" font-family="ui-monospace, monospace" font-size="10.5" fill="#7d8590">OUTPUT  <tspan fill="#58a6ff">: Production-Grade Software</tspan></text>
  </g>
</svg>