    <text x="22" y="13.5" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#3fb950">ONLINE</text>
  </g>

  <!-- NAME -->
  <text x="32" y="80" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, sans-serif" font-size="38" font-weight="700" fill="#f0f6fc" letter-spacing="-0.6">Adhil Roshan</text>

  <!-- SUBTITLE -->
  <text x="32" y="108" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Inter, sans-serif" font-size="14.5" font-weight="400" fill="#8b949e" letter-spacing="-0.1">Architecting autonomous agent workflows, local-first intelligence, and multi-platform systems.</text>

