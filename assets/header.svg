<svg width="920" height="190" viewBox="0 0 920 190" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient: Deep Obsidian with subtle top-to-bottom falloff -->
    <linearGradient id="card_bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#11161d" />
      <stop offset="100%" stop-color="#0a0d12" />
    </linearGradient>

    <!-- Specular Edge Highlight: Simulates directional overhead light catching the bezel -->
    <linearGradient id="specular_bezel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#388bfd" stop-opacity="0.35" />
      <stop offset="80%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>

    <!-- Subtle Soft Radial Luminance behind name -->
    <radialGradient id="soft_glow" cx="25%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Outer Bezel / Base Card -->
  <rect x="1" y="1" width="918" height="188" rx="12" fill="url(#card_bg)" stroke="#262c36" stroke-width="1"/>
  
  <!-- Subtle Soft Luminance -->
  <rect x="1" y="1" width="918" height="188" rx="12" fill="url(#soft_glow)" />

  <!-- Top Specular Bezel Line (Optical crispness) -->
  <path d="M12 1H908" stroke="url(#specular_bezel)" stroke-width="1.2" stroke-linecap="round" />

  <!-- LEFT PANE: Identity & System Focus -->
  <g transform="translate(38, 30)">
    <!-- Status Eyebrow with Live Green Dot -->
    <g transform="translate(0, 0)">
      <circle cx="4" cy="7" r="3" fill="#238636" />
      <circle cx="4" cy="7" r="6" fill="#238636" fill-opacity="0.2" />
      <text x="16" y="10.5" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#7d8590" letter-spacing="1">FULL-STACK AI ENGINEER • SENIOR AI ENG</text>
    </g>

    <!-- Primary Title / Name -->
    <text x="0" y="54" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, sans-serif" font-size="36" font-weight="700" fill="#f0f6fc" letter-spacing="-0.6">Adhil Roshan</text>

    <!-- Subtitle / Value Proposition -->
    <text x="0" y="84" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Inter, sans-serif" font-size="13.5" font-weight="400" fill="#8b949e" letter-spacing="-0.1">Architecting autonomous agent workflows, local-first intelligence, and multi-platform systems.</text>

    <!-- Stack Micro-Pills -->
    <g transform="translate(0, 110)">
      <rect x="0" y="0" width="86" height="22" rx="4" fill="#161b22" stroke="#262c36" stroke-width="1"/>
      <text x="43" y="15" font-family="ui-monospace, monospace" font-size="10.5" font-weight="500" fill="#8b949e" text-anchor="middle">TypeScript</text>

      <rect x="92" y="0" width="66" height="22" rx="4" fill="#161b22" stroke="#262c36" stroke-width="1"/>
      <text x="125" y="15" font-family="ui-monospace, monospace" font-size="10.5" font-weight="500" fill="#8b949e" text-anchor="middle">Python</text>

      <rect x="164" y="0" width="70" height="22" rx="4" fill="#161b22" stroke="#262c36" stroke-width="1"/>
      <text x="199" y="15" font-family="ui-monospace, monospace" font-size="10.5" font-weight="500" fill="#8b949e" text-anchor="middle">PyTorch</text>

      <rect x="240" y="0" width="66" height="22" rx="4" fill="#161b22" stroke="#262c36" stroke-width="1"/>
      <text x="273" y="15" font-family="ui-monospace, monospace" font-size="10.5" font-weight="500" fill="#8b949e" text-anchor="middle">Flutter</text>

      <rect x="312" y="0" width="60" height="22" rx="4" fill="#161b22" stroke="#262c36" stroke-width="1"/>
      <text x="342" y="15" font-family="ui-monospace, monospace" font-size="10.5" font-weight="500" fill="#8b949e" text-anchor="middle">Tauri</text>

      <rect x="378" y="0" width="88" height="22" rx="4" fill="#161b22" stroke="#262c36" stroke-width="1"/>
      <text x="422" y="15" font-family="ui-monospace, monospace" font-size="10.5" font-weight="500" fill="#8b949e" text-anchor="middle">Agentic AI</text>
    </g>
  </g>

  <!-- RIGHT PANE: Precision Engineering Console -->
  <g transform="translate(596, 28)">
    <rect width="286" height="132" rx="8" fill="#080b0f" stroke="#21262d" stroke-width="1"/>
    
    <!-- Console Header Bar -->
    <path d="M0 8C0 3.58172 3.58172 0 8 0H278C282.418 0 286 3.58172 286 8V26H0V8Z" fill="#13171f"/>
    <line x1="0" y1="26" x2="286" y2="26" stroke="#21262d" stroke-width="1"/>
    
    <!-- Window Controls -->
    <circle cx="14" cy="13" r="3.5" fill="#30363d" />
    <circle cx="25" cy="13" r="3.5" fill="#30363d" />
    <circle cx="36" cy="13" r="3.5" fill="#30363d" />

    <!-- Terminal Title -->
    <text x="52" y="16.5" font-family="ui-monospace, monospace" font-size="9.5" fill="#7d8590" letter-spacing="0.5">SYSTEM_KERNEL // v2026.09</text>
    
    <!-- Status -->
    <text x="272" y="16.5" font-family="ui-monospace, monospace" font-size="9" font-weight="600" fill="#3fb950" text-anchor="end">ONLINE</text>

    <!-- Specifications with optical alignment -->
    <text x="16" y="49" font-family="ui-monospace, monospace" font-size="10.5" fill="#7d8590">ROLE    <tspan fill="#e6edf3">: Senior AI Engineer</tspan></text>
    <text x="16" y="70" font-family="ui-monospace, monospace" font-size="10.5" fill="#7d8590">CORE    <tspan fill="#e6edf3">: Autonomous Agent Systems</tspan></text>
    <text x="16" y="91" font-family="ui-monospace, monospace" font-size="10.5" fill="#7d8590">MODELS  <tspan fill="#e6edf3">: Dynamic Inference &amp; RAG</tspan></text>
    <text x="16" y="112" font-family="ui-monospace, monospace" font-size="10.5" fill="#7d8590">DEPLOY  <tspan fill="#58a6ff">: Web • Mobile • Native</tspan></text>
  </g>
</svg>