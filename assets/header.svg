    <circle cx="4" cy="6" r="6.5" fill="#238636" fill-opacity="0.25" />
    <text x="16" y="10" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#7d8590" letter-spacing="1.2">// SENIOR AI ENGINEER • FULL-STACK SYSTEMS</text>
  </g>

  <g transform="translate(642, 24)">
