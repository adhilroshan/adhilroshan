<svg width="760" height="170" viewBox="0 0 760 170" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="header_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11161d" />
      <stop offset="100%" stop-color="#0a0d12" />
    </linearGradient>
    <linearGradient id="bezel_highlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="25%" stop-color="#58a6ff" stop-opacity="0.35" />
      <stop offset="75%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
    <radialGradient id="ambient_glow" cx="20%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#388bfd" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#388bfd" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Frame Background -->
  <rect x="1" y="1" width="758" height="168" rx="10" fill="url(#header_bg)" stroke="#262c36" stroke-width="1"/>
  <rect x="1" y="1" width="758" height="168" rx="10" fill="url(#ambient_glow)" />
  <path d="M10 1H750" stroke="url(#bezel_highlight)" stroke-width="1.2" stroke-linecap="round" />

  <!-- TOP ROW: Status Eyebrow & Online Tag -->
  <g transform="translate(32, 24)">
