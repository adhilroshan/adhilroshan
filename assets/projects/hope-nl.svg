<svg width="470" height="168" viewBox="0 0 470 168" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient: Subtle vertical falloff for tactile depth -->
    <linearGradient id="card_bg_hope-nl" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#11161d" />
      <stop offset="100%" stop-color="#0a0d12" />
    </linearGradient>
    <!-- Top Bezel Highlight: Simulates directional overhead lighting -->
    <linearGradient id="card_bezel_hope-nl" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
  </defs>

  <!-- Card Base with crisp 1px neutral stroke -->
  <rect x="1" y="1" width="468" height="166" rx="10" fill="url(#card_bg_hope-nl)" stroke="#262c36" stroke-width="1"/>
  
  <!-- Top Specular Highlight Line (Physical polish) -->
  <path d="M10 1H460" stroke="url(#card_bezel_hope-nl)" stroke-width="1" stroke-linecap="round" />

  <!-- Header: Icon, Title & Interactive Indicator -->
  <g transform="translate(22, 20)">
    <!-- Icon Container with subtle inset and stroke -->
    <rect x="0" y="0" width="32" height="32" rx="7" fill="#161b22" stroke="#2d333b" stroke-width="1"/>
    <path d="M12 2a9 9 0 00-9 9c0 3.88 2.5 7.18 6 8.41V22h6v-2.59c3.5-1.23 6-4.53 6-8.41a9 9 0 00-9-9zm-2 15v-1h4v1h-4zm3-3h-2v-2h2v2zm0-4h-2V6h2v4z" fill="#c9d1d9" transform="translate(4, 4) scale(1)"/>
    
    <!-- Title -->
    <text x="42" y="21" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, sans-serif" font-size="17" font-weight="600" fill="#f0f6fc" letter-spacing="-0.2">hope-nl</text>
    
    <!-- Subtle External Link Chevron Indicator -->
    <path d="M88 12L93 7M93 7H89M93 7V11" stroke="#484f58" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Badge Pill -->
  <g transform="translate(353.2, 23)">
    <rect x="0" y="0" width="94.8" height="22" rx="11" fill="#161b22" stroke="#2d333b" stroke-width="1"/>
    <text x="47.4" y="14.5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Inter, sans-serif" font-size="10.5" font-weight="500" fill="#8b949e" text-anchor="middle">LLM Research</text>
  </g>

  <!-- Description with optical tracking and leading -->
  <text x="24" y="80" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Inter, sans-serif" font-size="12.5" fill="#8b949e" letter-spacing="-0.1">PyTorch implementation of Nested Learning: dynamic LLMs that</text>
  <text x="24" y="99" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Inter, sans-serif" font-size="12.5" fill="#8b949e" letter-spacing="-0.1">rewrite their own weights as they read during live inference.</text>

  <!-- Tags -->
  <g transform="translate(24, 125)">
    <g transform="translate(0, 0)">
      <rect width="60.6" height="22" rx="4" fill="#161b22" stroke="#262c36" stroke-width="1"/>
      <text x="30.3" y="14.5" font-family="ui-monospace, monospace" font-size="10.5" font-weight="500" fill="#7d8590" text-anchor="middle">Python</text>
    </g><g transform="translate(67.6, 0)">
      <rect width="67.7" height="22" rx="4" fill="#161b22" stroke="#262c36" stroke-width="1"/>
      <text x="33.8" y="14.5" font-family="ui-monospace, monospace" font-size="10.5" font-weight="500" fill="#7d8590" text-anchor="middle">PyTorch</text>
    </g><g transform="translate(142.29999999999998, 0)">
      <rect width="110.3" height="22" rx="4" fill="#161b22" stroke="#262c36" stroke-width="1"/>
      <text x="55.1" y="14.5" font-family="ui-monospace, monospace" font-size="10.5" font-weight="500" fill="#7d8590" text-anchor="middle">Deep Learning</text>
    </g><g transform="translate(259.59999999999997, 0)">
      <rect width="74.8" height="22" rx="4" fill="#161b22" stroke="#262c36" stroke-width="1"/>
      <text x="37.4" y="14.5" font-family="ui-monospace, monospace" font-size="10.5" font-weight="500" fill="#7d8590" text-anchor="middle">Research</text>
    </g>
  </g>
</svg>