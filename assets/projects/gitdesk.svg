  </g>

  <!-- Description -->
  <text x="22" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12.5" fill="#8b949e" letter-spacing="-0.1">AI-native developer security partner with local vulnerability and</text>
  <text x="22" y="97" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12.5" fill="#8b949e" letter-spacing="-0.1">secret detection before commit/push, plus Git Worktree management.</text>

