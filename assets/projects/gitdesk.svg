<svg width="470" height="168" viewBox="0 0 470 168" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient: Subtle vertical falloff for tactile depth -->
    <linearGradient id="card_bg_gitdesk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#11161d" />
      <stop offset="100%" stop-color="#0a0d12" />
    </linearGradient>
    <!-- Top Bezel Highlight: Simulates directional overhead lighting -->
    <linearGradient id="card_bezel_gitdesk" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
  </defs>

  <!-- Card Base with crisp 1px neutral stroke -->
  <rect x="1" y="1" width="468" height="166" rx="10" fill="url(#card_bg_gitdesk)" stroke="#262c36" stroke-width="1"/>
  
  <!-- Top Specular Highlight Line (Physical polish) -->
  <path d="M10 1H460" stroke="url(#card_bezel_gitdesk)" stroke-width="1" stroke-linecap="round" />

  <!-- Header: Icon, Title & Interactive Indicator -->
  <g transform="translate(22, 20)">
    <!-- Icon Container with subtle inset and stroke -->
    <rect x="0" y="0" width="32" height="32" rx="7" fill="#161b22" stroke="#2d333b" stroke-width="1"/>
    <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-1 14.5l-3.5-3.5 1.41-1.41L11 12.67l5.09-5.09 1.41 1.41L11 15.5z" fill="#c9d1d9" transform="translate(4, 4) scale(1)"/>
    
    <!-- Title -->
    <text x="42" y="21" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, sans-serif" font-size="17" font-weight="600" fill="#f0f6fc" letter-spacing="-0.2">gitdesk</text>
    
    <!-- Subtle External Link Chevron Indicator -->
    <path d="M88 12L93 7M93 7H89M93 7V11" stroke="#484f58" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Badge Pill -->
  <g transform="translate(372.4, 23)">
    <rect x="0" y="0" width="75.6" height="22" rx="11" fill="#161b22" stroke="#2d333b" stroke-width="1"/>
    <text x="37.8" y="14.5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Inter, sans-serif" font-size="10.5" font-weight="500" fill="#8b949e" text-anchor="middle">DevSecOps</text>
  </g>

  <!-- Description with optical tracking and leading -->
  <text x="24" y="80" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Inter, sans-serif" font-size="12.5" fill="#8b949e" letter-spacing="-0.1">AI-native developer security partner with local vulnerability and</text>
  <text x="24" y="99" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Inter, sans-serif" font-size="12.5" fill="#8b949e" letter-spacing="-0.1">secret detection before commit/push, plus Git Worktree management.</text>

  <!-- Tags -->
  <g transform="translate(24, 125)">
    <g transform="translate(0, 0)">
      <rect width="60.6" height="22" rx="4" fill="#161b22" stroke="#262c36" stroke-width="1"/>
      <text x="30.3" y="14.5" font-family="ui-monospace, monospace" font-size="10.5" font-weight="500" fill="#7d8590" text-anchor="middle">Python</text>
    </g><g transform="translate(67.6, 0)">
      <rect width="89.0" height="22" rx="4" fill="#161b22" stroke="#262c36" stroke-width="1"/>
      <text x="44.5" y="14.5" font-family="ui-monospace, monospace" font-size="10.5" font-weight="500" fill="#7d8590" text-anchor="middle">TypeScript</text>
    </g><g transform="translate(163.6, 0)">
      <rect width="74.8" height="22" rx="4" fill="#161b22" stroke="#262c36" stroke-width="1"/>
      <text x="37.4" y="14.5" font-family="ui-monospace, monospace" font-size="10.5" font-weight="500" fill="#7d8590" text-anchor="middle">DevTools</text>
    </g><g transform="translate(245.39999999999998, 0)">
      <rect width="74.8" height="22" rx="4" fill="#161b22" stroke="#262c36" stroke-width="1"/>
      <text x="37.4" y="14.5" font-family="ui-monospace, monospace" font-size="10.5" font-weight="500" fill="#7d8590" text-anchor="middle">Security</text>
    </g>
  </g>
</svg>