      <text x="45.0" y="14.5" font-family="ui-monospace, monospace" font-size="10.5" font-weight="500" fill="#7d8590" text-anchor="middle">TypeScript</text>
    </g><g transform="translate(167.2, 0)">
      <rect width="75.6" height="22" rx="4" fill="#161b22" stroke="#21262d" stroke-width="1"/>
      <text x="37.8" y="14.5" font-family="ui-monospace, monospace" font-size="10.5" font-weight="500" fill="#7d8590" text-anchor="middle">DevTools</text>
    </g><g transform="translate(250.79999999999998, 0)">
      <rect width="75.6" height="22" rx="4" fill="#161b22" stroke="#21262d" stroke-width="1"/>
      <text x="37.8" y="14.5" font-family="ui-monospace, monospace" font-size="10.5" font-weight="500" fill="#7d8590" text-anchor="middle">Security</text>
