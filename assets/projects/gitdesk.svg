<svg width="470" height="165" viewBox="0 0 470 165" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Card Background: Deep Obsidian -->
  <rect x="1" y="1" width="468" height="163" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  
  <!-- Subtle Top Hairline Highlight -->
  <line x1="1" y1="1" x2="469" y2="1" stroke="#21262d" stroke-width="1" />

  <!-- Header: Icon & Title -->
  <g transform="translate(20, 20)">
    <!-- Icon Container -->
    <rect x="0" y="0" width="30" height="30" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-1 14.5l-3.5-3.5 1.41-1.41L11 12.67l5.09-5.09 1.41 1.41L11 15.5z" fill="#c9d1d9" transform="translate(3, 3) scale(1)"/>
    
    <!-- Title -->
    <text x="40" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="17" font-weight="600" fill="#f0f6fc">gitdesk</text>
  </g>

  <!-- Badge Pill -->
  <g transform="translate(371.5, 22)">
