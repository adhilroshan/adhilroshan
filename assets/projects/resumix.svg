<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 230" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#12171f"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="icon_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c2430"/>
      <stop offset="100%" stop-color="#10151c"/>
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect x="1" y="1" width="678" height="228" rx="14" fill="url(#bg)" stroke="#262c36" stroke-width="1"/>
  <rect x="2" y="2" width="676" height="1" rx="0.5" fill="url(#bezel)"/>

  <!-- Row 1: Header -->
  <rect x="24" y="24" width="48" height="48" rx="12" fill="url(#icon_bg)" stroke="#30363d" stroke-width="1"/>
  <path d="M37 36 L49 36 L55 42 L55 60 L37 60 Z M49 36 L49 42 L55 42 M42 48 L50 48 M42 53 L48 53" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Title & Category -->
  <text x="86" y="47" fill="#f0f6fc" font-size="22" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">resumix</text>
  <text x="86" y="66" fill="#8b949e" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" letter-spacing="0.8">MACHINE LEARNING</text>

  <!-- Right Badge -->
  <rect x="472" y="28" width="144" height="26" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="544" y="45" fill="#7ee787" font-size="10.5" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" letter-spacing="0.8" text-anchor="middle">RESUME AI ENGINE</text>

  <!-- Chevron -->
  <path d="M638 36 L646 36 L646 44 M646 36 L637 45" fill="none" stroke="#58a6ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Row 2: Description -->
  <text x="24" y="112" fill="#c9d1d9" font-size="15" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">AI-powered resume optimization engine with semantic ATS matching,</text>
  <text x="24" y="136" fill="#8b949e" font-size="14" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">analyzing job descriptions to deliver targeted keyword and structural score.</text>

  <!-- Row 3: Divider & Tags -->
  <line x1="24" y1="162" x2="656" y2="162" stroke="#21262d" stroke-width="1"/>

  <g transform="translate(24, 178)">
    <rect x="0" y="0" width="76" height="28" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="38" y="18" fill="#c9d1d9" font-size="12" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" text-anchor="middle">Python</text>

    <rect x="86" y="0" width="76" height="28" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="124" y="18" fill="#c9d1d9" font-size="12" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" text-anchor="middle">FastAPI</text>

    <rect x="172" y="0" width="102" height="28" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="223" y="18" fill="#c9d1d9" font-size="12" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" text-anchor="middle">Embeddings</text>

    <rect x="284" y="0" width="60" height="28" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="314" y="18" fill="#c9d1d9" font-size="12" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" text-anchor="middle">NLP</text>
  </g>
</svg>
