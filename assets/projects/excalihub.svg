    <rect x="0" y="0" width="30" height="30" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" fill="#c9d1d9" transform="translate(3, 3) scale(1)"/>
    
    <!-- Title -->
    <text x="40" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="17" font-weight="600" fill="#f0f6fc">excalihub</text>
