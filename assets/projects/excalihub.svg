<svg width="470" height="165" viewBox="0 0 470 165" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Card Background: Deep Obsidian -->
  <rect x="1" y="1" width="468" height="163" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  
  <!-- Subtle Top Hairline Highlight -->
  <line x1="1" y1="1" x2="469" y2="1" stroke="#21262d" stroke-width="1" />

  <!-- Header: Icon & Title -->
  <g transform="translate(20, 20)">
