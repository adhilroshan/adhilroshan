      <text x="42.0" y="14.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#c9d1d9" text-anchor="middle">Chrome MV3</text>
    </g>
    <g transform="translate(184.0, 0)">
      <rect width="84.0" height="22" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="42.0" y="14.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#c9d1d9" text-anchor="middle">GitHub API</text>
